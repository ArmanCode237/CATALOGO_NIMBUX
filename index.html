<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/ICON_1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regalos corporativos</title>
  </head>
  <body>
    <!-- Formulario oculto para que Netlify Forms registre los campos para tu CSV -->
    <form name="cotizaciones" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="orderId" />
      <input type="text" name="producto" />
      <input type="text" name="colorProducto" />
      <input type="text" name="tipoGrabado" />
      <input type="text" name="tipografia" />
      <input type="text" name="colorTarjeta" />
      <input type="text" name="nombre" />
      <input type="text" name="empresa" />
      <input type="email" name="correo" />
      <input type="text" name="whatsapp" />
      <input type="number" name="cantidad" />
    </form>

<!-- NUEVO: Formulario oculto para ASESORÍAS -->
    <form name="asesoria" netlify netlify-honeypot="bot-field" hidden>
      <!-- Agregamos la etiqueta para recibir el ID personalizado -->
      <input type="text" name="asesoriaId" /> 
      <input type="text" name="presupuesto" />
      <input type="text" name="volumen" />
      <input type="text" name="tiempo" />
      <input type="text" name="etapa" />
      <input type="text" name="tipo" />
      <input type="text" name="nombre" />
      <input type="text" name="empresa" />
      <input type="email" name="correo" />
      <input type="text" name="whatsapp" />
    </form>  

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
